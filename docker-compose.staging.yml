services:
  db-staging:
    image: postgres:16-alpine
    container_name: may_db_staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-may_user_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-may_password_staging}
      POSTGRES_DB: ${POSTGRES_DB:-may_staging}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  may:
    image: ghcr.io/dannymcc/may:dev
    container_name: may-dev
    restart: unless-stopped
    ports:
      - "5051:5050"
    depends_on:
      db-staging:
        condition: service_healthy
    volumes:
      - may_staging_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-staging}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-may_user_staging}:${POSTGRES_PASSWORD:-may_password_staging}@db-staging:5432/${POSTGRES_DB:-may_staging}
      - UPLOAD_FOLDER=/app/data/uploads
      - RELEASE_CHANNEL=dev
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Optional: Watchtower to auto-pull new dev images
  watchtower:
    image: containrrr/watchtower
    container_name: may-dev-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - DOCKER_API_VERSION=1.44
    command: --interval 300

volumes:
  may_staging_data:
  pgdata_staging:
